<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FreightMind · Document Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16222d;--muted:#5b6b7a;--line:#dde4ea;--teal:#0b6650;--teal-bg:#e5f4ef;--red:#b23a2e;--red-bg:#fbe7e4;--amb:#8a5a0a;--amb-bg:#fdf1dc;--purp:#5b3fa8;--purp-bg:#efe9fb;--head:#0f2b24;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}input,textarea{font:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--head);color:#fff;flex-wrap:wrap}
.brand b{font-size:16px;margin-right:8px}.brand span{opacity:.75;font-size:12.5px}
.views{display:flex;gap:4px;align-items:center;flex:1;flex-wrap:wrap}
.views button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#cfe7df;border-radius:8px;padding:6px 11px;font-size:13px}
.views button.on{background:#fff;color:var(--head);border-color:#fff;font-weight:600}
.demo-tag{font-size:10.5px;opacity:.6;margin-left:6px;border:1px dashed rgba(255,255,255,.4);border-radius:6px;padding:2px 6px}
.right{display:flex;gap:10px;align-items:center}.link{color:#9fe0cb;font-size:13px;text-decoration:none}
.pill{border-radius:20px;padding:4px 11px;font-size:12px;border:0}.pill.ok{background:#1d5a4a;color:#bff0dd}.pill.bad{background:#5a1d1d;color:#ffd0c8}.pill.muted{background:rgba(255,255,255,.12);color:#cfe7df}
.levels{display:flex;align-items:center;gap:6px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lv-label{font-weight:600;font-size:12.5px;margin-right:4px}.lv{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.lv.on{background:var(--purp-bg);border-color:#c9b9ef;color:var(--purp);font-weight:600}.lv-note{font-size:12px;color:var(--muted);margin-left:8px;flex-basis:100%}
.cg{display:flex;flex:1;min-height:0}
.inbox{width:330px;border-right:1px solid var(--line);background:#fff;overflow-y:auto;padding:12px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.inbox-head{display:flex;justify-content:space-between;align-items:baseline}.inbox-head span{font-size:12px;color:var(--muted)}
.row{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;width:100%}
.row.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-bg)}.row .r1{display:flex;gap:6px;align-items:center;font-size:12.5px}.row .r1 b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{color:var(--muted);font-size:11.5px}.row .r2{margin:5px 0;font-size:13px;color:#334}.row .r3{display:flex;gap:5px;flex-wrap:wrap}
.ch{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;background:#eef1f4;color:#3d4b58}.ch.a2a{background:var(--purp-bg);color:var(--purp)}.ch.email{background:#e6f0fb;color:#1f4f86}
.tag{font-size:11.5px;border-radius:7px;padding:2px 8px;font-weight:600;display:inline-block}.tag.ok{background:var(--teal-bg);color:var(--teal)}.tag.bad{background:var(--red-bg);color:var(--red)}.tag.warn{background:var(--amb-bg);color:var(--amb)}.tag.muted{background:#eef1f4;color:var(--muted)}.tag.bad-o{border:1px solid #f0bdb6;color:var(--red);background:#fff}
.metrics{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.metrics div b{display:block;font-size:18px}.metrics span{font-size:11px;color:var(--muted)}.metrics p{grid-column:1/-1;font-size:11px;color:var(--muted);margin:0}
.ok-t{color:var(--teal)}.bad-t{color:var(--red)}
.detail{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:14px}.empty.big{padding:60px;text-align:center}
.mail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.mail .m1{display:flex;gap:8px;align-items:center;font-size:15px}.mail .m2{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.atts{display:flex;flex-wrap:wrap;gap:6px}.att{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink);text-decoration:none;background:#fafbfc}
.att span{font-size:10.5px;font-weight:700;color:var(--teal);background:var(--teal-bg);border-radius:4px;padding:1px 5px}.att.reading span{color:var(--amb);background:var(--amb-bg)}.att.duplicate{opacity:.55}.att.error span{color:var(--red);background:var(--red-bg)}
.incoming{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}.bar{height:8px;background:#eef1f4;border-radius:6px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--teal);transition:width .4s}
.steps{margin:8px 0 0 18px;padding:0;font-size:13px}.steps li{margin:4px 0}.steps span{color:var(--muted)}.steps .t{float:right;font-family:var(--mono);font-size:11px}
.sub{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}.tabs button.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
.summary{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.summary .big{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:92px;text-align:center}
.summary .big b{display:block;font-size:26px}.summary .big span{font-size:12px;color:var(--muted)}.summary .bad b{color:var(--red)}.summary .warn b{color:var(--amb)}.summary .ok b{color:var(--teal)}
.verdict{flex:1;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.45}
.enrich{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin:12px 0}.enrich>div{background:var(--purp-bg);border-radius:10px;padding:10px 12px;font-size:13px}
.enrich .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--purp);font-weight:600}.enrich b{display:block;margin:3px 0}.enrich i{font-style:normal;font-size:11.5px;color:#5a4f72}.enrich .muted{color:var(--muted)}
.concept{font-size:10px;font-weight:700;color:var(--purp);border:1px dashed #b7a6e6;border-radius:5px;padding:1px 5px;white-space:nowrap}
.grp{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}.grp summary{padding:10px 14px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}.grp summary .n{color:var(--muted);font-weight:500}
.dot{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}.dot.ok{background:var(--teal-bg);color:var(--teal)}.dot.bad{background:var(--red-bg);color:var(--red)}.dot.warn{background:var(--amb-bg);color:var(--amb)}.dot.muted{background:#eef1f4;color:var(--muted)}
.chk{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:10px 14px;align-items:flex-start}.chk:hover{background:#fafcfd}
.cmain{flex:1;min-width:0}.cmain b{font-size:13.5px}.cf{font-size:12.5px;color:#334;margin-top:3px;word-break:break-word}.cf span{display:inline-block;width:62px;color:var(--muted);font-size:11.5px}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;max-width:210px}.docs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dchip{font-size:10.5px;font-weight:600;background:#eef1f4;color:#3d4b58;border-radius:5px;padding:1px 6px;white-space:nowrap}
.sev{font-size:10.5px;color:var(--muted)}.sev.critical{color:var(--red)}.sev.conn{color:var(--purp)}.conf{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.drawer-bg{position:fixed;inset:0;background:rgba(15,25,35,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer{width:min(560px,100%);background:#fff;height:100%;overflow-y:auto;padding:22px;position:relative;box-shadow:-10px 0 30px rgba(0,0,0,.1)}
.drawer .x{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:24px;color:var(--muted)}
.dh{display:flex;gap:8px;align-items:center;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}.dh.bad{color:var(--red)}.dh.warn{color:var(--amb)}.dh.ok{color:var(--teal)}
.drawer h3{margin:8px 0 12px}.drawer h4{margin:16px 0 6px;font-size:13px}
.fe{width:100%;border-collapse:collapse}.fe th{text-align:left;width:90px;color:var(--muted);font-weight:500;vertical-align:top;padding:6px 0;font-size:12.5px}.fe td{padding:6px 0;font-size:14px;font-weight:500;word-break:break-word}
.where{display:flex;flex-direction:column;gap:5px}.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-decoration:none;color:var(--ink);font-size:12.5px}
.wrow .wf{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wrow .wv{grid-column:1/3;font-weight:600;word-break:break-word}
.path{margin:6px 0 0 18px;padding:0;font-size:12.5px;color:#334}.path li{margin:3px 0}
.decide{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.decide input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border-radius:9px;padding:8px 14px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ok{background:var(--teal-bg);border-color:#9fd6c3;color:var(--teal)}.btn.bad{background:var(--red-bg);border-color:#f0bdb6;color:var(--red)}
.btn.ghost{background:#fff}.btn.full{width:100%}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.6;cursor:default}
.reply{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.reply label,.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.reply input,.modal input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13.5px}.reply textarea{border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
.rhint{background:var(--teal-bg);color:#14493c;border-radius:8px;padding:8px 10px;font-size:12.5px}
.learned,.trace{display:flex;flex-direction:column;gap:10px}.lcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.lh{display:flex;gap:6px;align-items:center;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.ft{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}.ft th{text-align:left;background:#f3f6f8;padding:7px 8px;font-weight:600}.ft td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.ft td.b{color:var(--red)}.ft td.a{color:var(--teal);font-weight:600}.ft.big{font-size:13.5px}.mono{font-family:var(--mono);font-size:12px}
.modal{background:#fff;border-radius:14px;padding:20px;width:min(560px,94%);max-height:92vh;overflow-y:auto;margin:auto;display:flex;flex-direction:column;gap:10px;align-self:center}
.su,.cust,.kn{flex:1;overflow-y:auto;padding:18px 22px}.su-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.su-head h2,.cust h2,.kn h2{margin:0 0 4px}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}.explain>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.explain p{margin:6px 0 0;font-size:13px;color:#334}
.su-verdict{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:12px 14px;margin:12px 0;flex-wrap:wrap}.su-verdict.bad{background:var(--red-bg)}.su-verdict.warn{background:var(--amb-bg)}.su-verdict.ok{background:var(--teal-bg)}
.kn h3{margin:18px 0 8px}.kn tr.proposed{background:#fffbf2}.dts{display:flex;gap:6px;flex-wrap:wrap}
.err{background:var(--red-bg);color:#5a1d16;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45}.pillwrap{display:inline-flex;gap:4px}
.addr{background:var(--teal-bg);border-radius:10px;padding:9px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}.addr div{display:flex;flex-direction:column}.addr span{color:var(--muted);font-size:11px}.addr b{font-family:var(--mono);font-size:12px;word-break:break-all}.addr i{font-style:normal;color:#14493c;font-size:11.5px}.addr.muted{background:#f3f6f8}.addr.wide{margin:14px 0;max-width:620px}
.tag.gm{background:#e6f0fb;color:#1f4f86}.gmail{border:1px dashed #9fb8d8;background:#f3f7fc;border-radius:8px;padding:9px 11px;font-size:13px}.gmail.on{border-style:solid;border-color:#9fd6c3;background:var(--teal-bg)}
.pclist{display:flex;flex-direction:column;gap:6px;margin:12px 0;max-width:620px}
.relay{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.relay summary{cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}.relay .code{background:#0f2b24;color:#cfe7df;font-size:10.5px;padding:8px;border-radius:8px;max-height:120px;overflow:auto;white-space:pre}.steps2{margin:6px 0 6px 18px;padding:0}.steps2 li{margin:3px 0}
.f2{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}.f2 select{border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;color:var(--ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:9px;padding:2px;margin-left:8px}.seg button{border:0!important;background:transparent!important;color:#cfe7df!important;padding:5px 10px!important}.seg button.on{background:#fff!important;color:var(--head)!important;font-weight:600}
.oc{flex:1;overflow-y:auto;padding:18px 22px}.oc-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.oc-head h2{margin:0 0 4px}.oc-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.oc-ctl select{border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chkl{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}.tag2{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--amb-bg);color:var(--amb)}
.demo-note{background:var(--amb-bg);color:#5a3d07;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:10px 0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.trend{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.trend svg{width:100%;height:auto}.th2{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}
.oc h3{margin:18px 0 8px}.ft td.n{text-align:right;font-family:var(--mono)}.ft tr.tot td{font-weight:700;background:#f8faf9}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ===== theme: enterprise logistics look (navy rail, blue primary, light surfaces) ===== */
:root{--bg:#f3f5fa;--card:#fff;--ink:#101828;--muted:#5d6b82;--line:#e3e8f1;--pri:#2563eb;--pri-bg:#eaf1ff;--pri-ink:#1e40af;--navy:#0c1a36;--navy2:#13264d;
  --teal:#12805c;--teal-bg:#e7f6ef;--red:#c23b2c;--red-bg:#fdecea;--amb:#a15c07;--amb-bg:#fef3e0;--purp:#2563eb;--purp-bg:#eaf1ff;--head:#0c1a36;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:232px;flex-shrink:0;background:var(--navy);color:#c9d4ea;display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.side .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.side .brand b{display:block;color:#fff;font-size:15px;margin:0}.side .brand span{display:block;font-size:11.5px;color:#8fa0c2;opacity:1}
.sgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f82a8;margin:12px 10px 4px;font-weight:600}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button,.snav a{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#c9d4ea;border-radius:8px;padding:9px 10px;font-size:13.5px;text-decoration:none;position:relative}
.snav button:hover,.snav a:hover{background:rgba(255,255,255,.06);color:#fff}
.snav button.on{background:var(--navy2);color:#fff;font-weight:600}.snav button.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#3b82f6}
.ic{width:18px;height:18px;flex-shrink:0}
.side-foot{margin-top:auto;padding:10px 8px 0}.side-foot .demo-tag{display:block;margin:0;font-size:11px;color:#8fa0c2;border:1px dashed rgba(143,160,194,.4);border-radius:8px;padding:6px 8px;opacity:1;line-height:1.35}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.top2{display:flex;align-items:center;gap:14px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{display:flex;flex-direction:column;margin-right:6px}.crumb b{font-size:17px;letter-spacing:-.01em}.crumb span{font-size:12px;color:var(--muted)}
.top2 .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{background:#eef2f8!important;border-radius:9px;padding:3px;margin-left:0}.seg button{color:var(--muted)!important;border-radius:7px!important;font-size:13px}.seg button.on{background:#fff!important;color:var(--ink)!important;box-shadow:var(--shadow)}
.deskpill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;box-shadow:var(--shadow)}.deskpill:hover{background:#f7f9fc}.deskpill .ic{width:15px;height:15px;color:var(--pri)}
.pill{border-radius:999px;padding:6px 12px;font-size:12.5px;border:1px solid var(--line);box-shadow:var(--shadow)}.pill.ok{background:var(--teal-bg);color:var(--teal);border-color:#bfe6d4}.pill.bad{background:var(--red-bg);color:var(--red);border-color:#f5c2bb}.pill.muted{background:#fff;color:var(--muted)}
.levels{padding:8px 22px;background:#fbfcfe}.lv{border-radius:8px;background:#fff}.lv.on{background:var(--pri-bg);border-color:#bcd0fb;color:var(--pri-ink)}
.inbox{background:#fbfcfe;padding:14px}.row{border-radius:10px;box-shadow:var(--shadow);transition:border-color .15s}.row:hover{border-color:#c7d3e6}.row.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.ch.email{background:var(--pri-bg);color:var(--pri-ink)}.tag.gm{background:var(--pri-bg);color:var(--pri-ink)}
.mail,.incoming,.verdict,.summary .big,.grp,.reply,.lcard,.kpi2,.trend,.explain>div,.nextsteps,.deskscope{border-radius:12px;box-shadow:var(--shadow);border-color:var(--line)}
.summary .big b{font-size:28px;letter-spacing:-.02em}
.tabs button.on{border-bottom-color:var(--pri);color:var(--pri-ink)}
.btn{border-radius:8px}.btn.primary{background:var(--pri);border-color:var(--pri)}.btn.primary:hover{background:#1d4ed8}
.enrich>div{background:#f4f7fd;border:1px solid #dfe7f6}.enrich .k{color:var(--pri-ink)}.enrich i{color:var(--muted)}.concept{color:var(--pri-ink);border-color:#a9c1f5}
.ft th{background:#f6f8fc;color:#344054;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.ft{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi2.hero{background:linear-gradient(135deg,#eaf1ff,#f5f8ff);border-color:#cfdcfb}
.deskscope{background:#f7f9fd}.deskopt.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bg)}
.ladder i.on{background:var(--pri)}
.relay .code{background:var(--navy)}.toast{background:var(--navy)}
.su,.cust,.kn,.oc{padding:20px 24px}
.kpis2{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.ft td:has(.ladder){white-space:nowrap}
@media (max-width:900px){.shell{flex-direction:column;height:auto;overflow:visible}.side{width:100%;padding:10px 12px;gap:6px}.side .brand{border:0;margin:0;padding:2px 4px}.sgrp,.side-foot{display:none}.snav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}.snav button,.snav a{width:auto;white-space:nowrap;flex-shrink:0;padding:7px 10px}.snav button.on:before{display:none}.mainc{height:auto;min-height:100vh}.top2{padding:10px 14px}.top2 .right{margin-left:0}}
</style>
