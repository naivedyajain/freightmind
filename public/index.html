<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreightMind — agentic assistant for logistics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --line:#e5eaef; --line2:#eef2f5;
  --ink:#16202b; --ink2:#576571; --ink3:#8b98a5;
  --teal:#0f8368; --teal2:#e5f4ef; --teald:#0b6650;
  --amber:#b8791a; --amber2:#fbf1e0; --red:#c4463a; --red2:#fbecea; --blue:#3f7fc4;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
#root{height:100vh}
.shell{display:flex;flex-direction:column;height:100vh;max-width:1180px;margin:0 auto;background:var(--bg)}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.4px}
.brand h1 span{color:var(--teal)}
.brand em{font-size:11.5px;color:var(--ink3);font-style:normal}
.hdrr{display:flex;align-items:center;gap:12px}
.msel{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.kin{display:flex;gap:6px}
.kin input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-family:var(--mono);font-size:12px;width:150px}
.kin input:focus{outline:none;border-color:var(--teal)}
.kin button{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer}
.kok{font-size:12px;color:var(--teal);cursor:pointer;font-weight:500}

.body{display:flex;flex:1;min-height:0}
.rail{width:236px;border-right:1px solid var(--line);padding:16px 14px;overflow-y:auto;background:var(--card);flex-shrink:0}
.rgroup{margin-bottom:20px}
.rlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.soon{background:var(--amber2);color:var(--amber);font-size:8.5px;padding:1px 6px;border-radius:4px;letter-spacing:.3px}
.ract{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
.ract:hover{border-color:var(--teal);background:var(--teal2)}
.ract.on{border-color:var(--teal);background:var(--teal2)}
.ract b{display:block;font-size:12.5px;color:var(--ink);font-weight:600}
.ract i{font-style:normal;font-size:11px;color:var(--ink3)}
.ract.subtle b{font-weight:500}
.costbox{background:#0f2b24;border-radius:10px;padding:12px 13px;color:#fff}
.costn{font-size:22px;font-weight:700;font-family:var(--mono);color:#5fe3c0}
.costl{font-size:10.5px;color:#9dc9be;margin-top:1px}
.costproj{font-size:11px;color:#c5e8df;margin-top:7px;padding-top:7px;border-top:1px solid #1c4034}
.conn{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--ink3);margin-bottom:6px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.thread{flex:1;overflow-y:auto;padding:22px 26px 10px}
.welcome{max-width:560px;margin:24px auto 0;text-align:center}
.welcome h2{font-size:22px;font-weight:600;letter-spacing:-.4px;margin-bottom:10px}
.welcome p{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:18px}
.wex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.wdoc{font-size:12.5px;color:var(--ink3)}
.wdoc .link,.wdoc a{color:var(--teal);cursor:pointer;text-decoration:none}
.wdoc .link:hover,.wdoc a:hover{text-decoration:underline}
.trybox{background:var(--teal2);border:1px solid #bfe3d6;border-radius:12px;padding:16px 18px;margin-top:20px}
.tryhead{font-size:13px;font-weight:600;color:var(--teald);margin-bottom:11px}
.tryrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.trybtn{border:none;border-radius:8px;padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.trybtn.dl{background:var(--teal);color:#fff}
.trybtn.dl2{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.trybtn.up{background:#fff;color:var(--teald);border:1px solid #bfe3d6}
.trybtn:hover{filter:brightness(1.05)}
.tryhint{font-size:11.5px;color:var(--teald);margin-top:10px;opacity:.85}

.msg{margin-bottom:16px;display:flex}
.msg.user{justify-content:flex-end}
.msg.ai{justify-content:flex-start}
.bub{max-width:82%;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.55}
.msg.user .bub{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:88%}
.bub.thinking{color:var(--ink3);font-size:13px;display:flex;align-items:center;gap:8px}
.bub.err{background:var(--red2);border-color:#e6b5ae;color:var(--red)}
.dot3 i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink3);margin:0 1px;animation:bl 1.2s infinite}
.dot3 i:nth-child(2){animation-delay:.2s}.dot3 i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.atext{font-size:14px;margin-bottom:4px}
.atext.refuse{color:var(--amber)}
.atext b{font-weight:600}
.warntext{color:var(--amber);font-weight:500}

.chart{margin:12px 0;padding:12px;background:#fafbfc;border-radius:9px}
.tw{margin:10px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tw table{border-collapse:collapse;width:100%;font-size:12.5px}
.tw th,.tw td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line2)}
.tw th{background:#fafbfc;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600}
.tw tr:last-child td{border-bottom:none}
.tw .num{text-align:right;font-family:var(--mono)}
.more{padding:7px 11px;font-size:11px;color:var(--ink3);background:#fafbfc}

.follows{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0 2px}
.fchip{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px 13px;font-size:12.5px;color:var(--teal);cursor:pointer;transition:.12s}
.fchip:hover{background:var(--teal2);border-color:var(--teal)}

.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.exf{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.exf.low{border-color:#e6c896;background:var(--amber2)}
.exk{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:3px}
.exv{font-size:14px;font-weight:600;font-family:var(--mono);display:flex;align-items:center;gap:7px}
.confb{font-size:9.5px;font-family:var(--mono);color:var(--ink3);font-weight:400}
.confb.warn{color:var(--amber)}
.exfix{display:flex;flex-direction:column;gap:5px}
.fixin{border:1px solid var(--amber);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:13px;width:100%}
.fixin:focus{outline:none;border-color:var(--teald)}
.stored{margin-top:10px;font-size:12.5px;color:var(--teal);font-weight:500}

.wfrun{margin:12px 0;display:flex;flex-direction:column;gap:7px}
.wfstep{display:flex;align-items:center;gap:11px;background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:10px 13px}
.wfstep.paused{background:#f3f0fb;border-color:#d9cef2}
.wfic{width:20px;height:20px;border-radius:50%;background:var(--teal2);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.wfstep.paused .wfic{background:#e6ddf7;color:#7857c8}
.wfmid{flex:1}.wfmid b{font-size:13px}.wfd{font-size:11.5px;color:var(--ink3)}
.wfbadge{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:5px;background:var(--teal2);color:var(--teal)}
.wfbadge.paused{background:#e6ddf7;color:#7857c8}
.wfsum{background:var(--teal2);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--teald);line-height:1.55}
.wfsum b{color:var(--teald);font-weight:700}

.trace{margin-top:11px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;overflow:hidden;background:#fbfcfd}
.trace .th{display:flex;align-items:center;gap:7px;padding:8px 11px;color:var(--ink3);cursor:pointer;user-select:none}
.trace .th b{color:var(--ink2);font-weight:600}
.trace .th .ca{color:var(--teal)}
.trace .th .tc{margin-left:auto}
.trace .tb{border-top:1px solid var(--line2);padding:10px 11px;background:#fff}
.trace .tb pre{color:#0a5a8a;white-space:pre-wrap;line-height:1.6;font-family:var(--mono);font-size:11px}
.trace .tm{margin-top:7px;padding-top:7px;border-top:1px solid var(--line2);color:var(--ink3)}

.composer{display:flex;align-items:center;gap:9px;padding:13px 26px 18px;border-top:1px solid var(--line);background:var(--bg)}
.attach{background:var(--card);border:1px solid var(--line);border-radius:9px;width:40px;height:42px;font-size:16px;cursor:pointer;flex-shrink:0}
.attach:hover{border-color:var(--teal)}
.cin{flex:1;border:1px solid var(--line);border-radius:11px;padding:13px 16px;font-size:14px;background:var(--card)}
.cin:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal2)}
.cin:disabled{background:#f0f2f4;color:var(--ink3)}
.send{background:var(--teal);color:#fff;border:none;border-radius:11px;padding:0 22px;height:44px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.send:disabled{opacity:.4;cursor:not-allowed}

.btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.mt{margin-top:10px}
.mt{margin-top:10px}

.overlay{position:absolute;inset:0;background:rgba(15,25,35,.4);display:flex;align-items:center;justify-content:center;padding:30px;z-index:50}
.ov{background:var(--card);border-radius:14px;max-width:620px;width:100%;max-height:82vh;overflow-y:auto;position:relative}
.ovx{position:absolute;top:14px;right:18px;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1}
.ovc{padding:26px 28px}
.ovc h2{font-size:19px;font-weight:600;margin-bottom:12px}
.ovp{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
.ovp.ovnote{background:#fafbfc;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:11px 14px}
.ontrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:14px 0}
.ont{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:11px}
.ont h4{font-size:12.5px;color:var(--teal);margin-bottom:4px}
.ont span{font-size:11px;color:var(--ink3);font-family:var(--mono);line-height:1.5}
.dstep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.dstep:last-of-type{border-bottom:none}
.dn{font-family:var(--mono);color:var(--teal);font-weight:700;width:22px;flex-shrink:0}
.dstep b{font-size:13px}.dsay{font-size:12.5px;color:var(--ink3);font-style:italic;margin-top:3px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:820px){
  .rail{display:none}
  .bub{max-width:90%}
  .exgrid{grid-template-columns:1fr}
}
</style>
